name: Bug or playtest finding
description: Something broken, confusing, or unbalanced
labels: [bug]
body:
  - type: textarea
    id: what
    attributes:
      label: What happened
      description: Include the seed (`?seed=` in the URL or shown on the end screen) and location if it's in a run.
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: What you expected
  - type: input
    id: device
    attributes:
      label: Device / browser
